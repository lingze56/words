<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>小背词 Pro</title>
  <style>
    :root {
      --bg: #fafaf8;
      --card: #fff;
      --text: #2c2c2c;
      --sub: #999;
      --muted: #c5c5c2;
      --pri: #4a8c6f;
      --pri-light: #eaf5ef;
      --gold: #c4a35a;
      --danger: #d4686c;
      --danger-light: #fef0f0;
      --radius: 14px;
      --shadow: 0 1px 3px rgba(0,0,0,0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); padding-bottom: 90px;
      -webkit-font-smoothing: antialiased;
    }
    /* 导航 */
    .nav {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: #fff; border-radius: 28px; display: flex; padding: 4px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08); z-index: 100; gap: 0;
    }
    .nav-btn {
      width: 56px; height: 44px; border: none; background: none; border-radius: 24px;
      font-size: 11px; color: var(--muted); cursor: pointer; display: flex;
      flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      transition: all 0.2s;
    }
    .nav-btn.on { color: var(--pri); font-weight: 600; }
    .nav-btn svg { width: 20px; height: 20px; }
    .page { display: none; padding: 0 16px 20px; min-height: 100vh; animation: fadeIn 0.2s; }
    .page.on { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* 通用 */
    .section { margin-bottom: 20px; }
    .label { font-size: 11px; color: var(--sub); letter-spacing: 0.5px; margin-bottom: 8px; }
    .card {
      background: var(--card); border-radius: var(--radius); padding: 18px 20px;
      box-shadow: var(--shadow); margin-bottom: 10px;
    }
    .btn {
      display: block; width: 100%; padding: 14px; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; margin-bottom: 8px;
      transition: all 0.15s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-pri { background: var(--pri); color: #fff; }
    .btn-outline { background: transparent; color: var(--pri); border: 1.5px solid var(--pri); }
    .btn-ghost { background: transparent; color: var(--sub); border: 1px dashed #e0e0dc; font-size: 13px; padding: 11px; }
    .btn-sm { display: inline; width: auto; padding: 7px 16px; font-size: 12px; border-radius: 8px; margin: 0; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row-btns { display: flex; gap: 8px; }
    .row-btns .btn { flex: 1; margin: 0; }

    /* 首页 */
    .hero { text-align: center; padding: 32px 0 16px; }
    .hero-word { font-size: 42px; font-weight: 800; letter-spacing: -1px; color: var(--text); line-height: 1.1; }
    .hero-sub { font-size: 13px; color: var(--sub); margin-top: 6px; }
    .stat-mini {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
      background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
      overflow: hidden;
    }
    .stat-mini-item {
      text-align: center; padding: 16px 4px; position: relative;
    }
    .stat-mini-item:not(:last-child)::after {
      content: ''; position: absolute; right: 0; top: 50%; transform: translateY(-50%);
      width: 1px; height: 28px; background: #f0f0ec;
    }
    .stat-mini-num { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1; }
    .stat-mini-lbl { font-size: 10px; color: var(--sub); margin-top: 4px; }
    .dot-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #e8e8e2; display: inline-block; }
    .dot.on { background: var(--pri); }
    .dot.warn { background: var(--gold); }
    .tag {
      display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 8px;
      margin-right: 4px;
    }
    .tag-l0 { background: #fef0f0; color: var(--danger); }
    .tag-l1 { background: #fff8e8; color: #b8860b; }
    .tag-l2 { background: #eaf5ef; color: var(--pri); }
    .tag-l3 { background: #e8f0f8; color: #3a6d8c; }
    .tag-l4 { background: #f0e8f6; color: #5b3a8c; }

    /* 日历（干净版） */
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .cal-month { font-size: 14px; font-weight: 600; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .cal-day-lbl { text-align: center; font-size: 9px; color: var(--muted); padding: 4px 0; }
    .cal-cell {
      aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: var(--muted); position: relative;
    }
    .cal-cell.hit { background: var(--pri-light); color: var(--pri); font-weight: 600; }
    .cal-cell.today { color: var(--pri); font-weight: 700; }
    .cal-cell.today::after { content: ''; position: absolute; bottom: 3px; width: 4px; height: 4px; border-radius: 50%; background: var(--pri); }
    .cal-cell.today.hit::after { background: #fff; }

    /* 学习页 */
    .flow-steps { display: flex; gap: 0; margin-bottom: 20px; }
    .flow-step { flex: 1; text-align: center; }
    .flow-dot { width: 10px; height: 10px; border-radius: 50%; background: #e8e8e2; margin: 0 auto 4px; }
    .flow-step.on .flow-dot { background: var(--pri); }
    .flow-step.done .flow-dot { background: var(--pri-light); border: 2px solid var(--pri); }
    .flow-step span { font-size: 10px; color: var(--muted); }
    .flow-step.on span { color: var(--pri); font-weight: 600; }

    .study-card { margin-bottom: 16px; }
    .study-word-area { text-align: center; padding: 40px 20px 32px; }
    .study-word { font-size: 38px; font-weight: 800; letter-spacing: -1px; color: var(--text); line-height: 1.2; word-break: break-word; }
    .study-word-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .speak-btn {
      width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid #e8e8e2; background: #fff;
      font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.15s;
    }
    .speak-btn:active { background: var(--pri-light); border-color: var(--pri); }
    .study-progress-row { padding: 0 20px 8px; }
    .study-progress-bar { height: 3px; background: #f0f0ec; border-radius: 2px; margin-bottom: 6px; }
    .study-progress-fill { height: 3px; background: var(--pri); border-radius: 2px; transition: width 0.3s; }
    .study-progress-info { display: flex; justify-content: space-between; font-size: 11px; color: var(--sub); }
    .study-input-area { padding: 16px 20px 20px; border-top: 1px solid #f5f5f0; }
    .study-input {
      display: block; width: 100%; padding: 14px 16px; margin-bottom: 10px;
      border: 1.5px solid #e8e8e2; border-radius: 12px; font-size: 16px;
      background: #fafaf8; color: var(--text); outline: none; text-align: center; transition: border-color 0.2s;
    }
    .study-input:focus { border-color: var(--pri); background: #fff; }
    .study-fb {
      padding: 10px 14px; border-radius: 10px; font-size: 13px; text-align: center; margin-top: 8px;
      animation: fadeIn 0.2s;
    }
    .study-fb:empty { display: none; }
    .fb-ok { background: var(--pri-light); color: var(--pri); }
    .fb-err { background: var(--danger-light); color: var(--danger); }
    .study-done { text-align: center; padding: 48px 20px 32px; }
    .study-done-icon { font-size: 48px; margin-bottom: 12px; }
    .study-done-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .study-done-sub { font-size: 13px; color: var(--sub); line-height: 1.8; margin-bottom: 24px; }
    .study-time-info { font-size: 11px; color: var(--sub); margin-top: 4px; }

    /* 消除赛 */
    .match-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
    .mc {
      background: #fafaf8; border: 1.5px solid #e8e8e2; border-radius: 10px;
      padding: 12px 4px; min-height: 52px; display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 11px; line-height: 1.35; cursor: pointer;
      user-select: none; word-break: break-word; transition: all 0.15s;
    }
    .mc.sel { border-color: var(--pri); background: var(--pri-light); color: var(--pri); font-weight: 700; }
    .mc.ok { animation: popOff 0.35s forwards; pointer-events: none; }
    .mc.err { border-color: var(--danger) !important; background: var(--danger-light) !important; animation: shake 0.3s; }
    @keyframes popOff { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); } 100% { transform: scale(0); opacity: 0; } }
    @keyframes shake { 0%,100% { transform: translateX(0); } 30% { transform: translateX(-4px); } 70% { transform: translateX(4px); } }

    /* 词库 */
    .word-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f5f5f0; }
    .word-row:last-child { border-bottom: none; }
    .word-en { font-size: 14px; font-weight: 600; }
    .word-ch { font-size: 12px; color: var(--sub); text-align: right; max-width: 55%; }
    .word-meta { font-size: 10px; color: var(--muted); }

    /* 折叠 */
    .fold-trigger {
      display: flex; align-items: center; justify-content: space-between; width: 100%;
      padding: 14px 0; border: none; background: none; font-size: 14px; color: var(--text);
      cursor: pointer; font-weight: 500;
    }
    .fold-trigger::after { content: '›'; font-size: 16px; color: var(--muted); transition: transform 0.2s; }
    .fold.open .fold-trigger::after { transform: rotate(90deg); }
    .fold-body { display: none; padding-bottom: 12px; }
    .fold.open .fold-body { display: block; animation: fadeIn 0.2s; }

    /* Toast */
    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: var(--text); color: #fff; padding: 10px 24px; border-radius: 20px;
      font-size: 13px; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* 图表 */
    .mini-chart { display: flex; align-items: flex-end; gap: 3px; height: 48px; }
    .mini-bar {
      flex: 1; border-radius: 3px 3px 0 0; background: #e8e8e2; min-height: 2px;
      transition: height 0.4s;
    }
    .mini-bar.fill { background: var(--pri); }
    .mini-bar.warn { background: var(--gold); }
    .mini-chart-labels { display: flex; gap: 3px; margin-top: 4px; }
    .mini-chart-labels span { flex: 1; text-align: center; font-size: 9px; color: var(--muted); }

    select, input[type="number"], input[type="text"], textarea {
      width: 100%; padding: 12px 14px; border: 1.5px solid #e8e8e2; border-radius: 10px;
      font-size: 14px; background: #fafaf8; color: var(--text); outline: none; margin-bottom: 8px;
      font-family: inherit; transition: border-color 0.2s;
    }
    select:focus, input:focus, textarea:focus { border-color: var(--pri); background: #fff; }
    textarea { resize: none; line-height: 1.6; }
    input[type="file"] {
      width: 100%; padding: 10px; border: 1.5px dashed #e8e8e2; border-radius: 10px;
      font-size: 12px; background: #fafaf8; color: var(--text); margin-bottom: 8px;
    }
    .kbd {
      display: inline-block; font-size: 10px; background: #f0f0ec; color: var(--sub);
      padding: 2px 6px; border-radius: 4px; margin: 0 2px;
    }
    .ai-result {
      padding: 14px; border-radius: 10px; background: #fafaf8; border: 1px solid #f0f0ec;
      font-size: 13px; line-height: 1.8; color: var(--text); max-height: 50vh; overflow-y: auto;
      white-space: pre-wrap; margin-top: 10px;
    }
    .ai-result:empty { display: none; }
    .ai-loading { text-align: center; padding: 24px; color: var(--sub); font-size: 13px; }
    .spinner { width: 24px; height: 24px; border: 2.5px solid #f0f0ec; border-top-color: var(--pri); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .plan-badge {
      display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 4px 10px;
      border-radius: 10px; background: var(--pri-light); color: var(--pri); margin-left: 8px;
    }
    .warn-badge {
      display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 4px 10px;
      border-radius: 10px; background: #fff8e8; color: #b8860b;
    }

    /* ============ 响应式 ============ */
    /* 平板 600-899px */
    @media (min-width: 600px) and (max-width: 899px) {
      body { padding: 0 40px 100px; }
      .page { padding: 0 12px 24px; }
      .hero { padding: 40px 0 20px; }
      .hero-word { font-size: 52px; }
      .hero-sub { font-size: 14px; }
      .stat-mini-item { padding: 22px 8px; }
      .stat-mini-num { font-size: 28px; }
      .stat-mini-lbl { font-size: 11px; }
      .card { padding: 22px 24px; border-radius: 16px; }
      .study-word { font-size: 46px; }
      .study-word-area { padding: 48px 28px 40px; }
      .study-input { padding: 16px 18px; font-size: 18px; }
      .mc { padding: 14px 8px; min-height: 64px; font-size: 13px; }
      .match-grid { gap: 8px; }
      .nav-btn { width: 64px; height: 48px; font-size: 12px; }
      .nav-btn svg { width: 22px; height: 22px; }
      .cal-cell { font-size: 12px; }
      .btn { font-size: 16px; padding: 16px; }
      .word-en { font-size: 16px; }
      .word-ch { font-size: 13px; }
      .fold-trigger { font-size: 15px; }
    }

    /* 桌面 ≥900px */
    @media (min-width: 900px) {
      html { background: #f0efe8; }
      body {
        max-width: 520px; margin: 0 auto; padding-bottom: 100px;
        box-shadow: 0 0 80px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.03);
        min-height: 100vh; background: var(--bg);
      }
      .page { padding: 0 20px 24px; }
      .hero { padding: 48px 0 24px; }
      .hero-word { font-size: 56px; }
      .hero-sub { font-size: 15px; }
      .stat-mini-item { padding: 24px 12px; }
      .stat-mini-num { font-size: 30px; }
      .stat-mini-lbl { font-size: 12px; }
      .card { padding: 24px 28px; border-radius: 18px; }
      .study-word { font-size: 48px; }
      .study-word-area { padding: 56px 32px 48px; }
      .study-input { padding: 18px 20px; font-size: 19px; }
      .mc { padding: 16px 10px; min-height: 72px; font-size: 14px; }
      .match-grid { gap: 10px; }
      .nav {
        width: calc(100% - 40px); max-width: 480px;
        bottom: 20px;
      }
      .nav-btn { width: 72px; height: 50px; font-size: 12px; }
      .nav-btn svg { width: 22px; height: 22px; }
      .cal-cell { font-size: 13px; border-radius: 8px; }
      .btn { font-size: 17px; padding: 18px; }
      .word-en { font-size: 17px; }
      .word-ch { font-size: 14px; }
      .fold-trigger { font-size: 16px; }
      .toast { font-size: 14px; padding: 12px 28px; }
      .mini-chart { height: 56px; }
    }
  </style>
</head>
<body>
<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ========== 首页 ========== -->
<div class="page on" id="p-home">
  <div class="hero">
    <div style="font-size:12px;color:var(--sub);letter-spacing:1px;margin-bottom:4px;">今日进度</div>
    <div class="hero-word" id="heroToday">0</div>
    <div class="hero-sub">已学单词 · 连续 <span id="heroStreak">0</span> 天</div>
  </div>

  <div class="stat-mini section">
    <div class="stat-mini-item"><div class="stat-mini-num" id="hmTotal">0</div><div class="stat-mini-lbl">词库</div></div>
    <div class="stat-mini-item"><div class="stat-mini-num" id="hmWrong">0</div><div class="stat-mini-lbl">错题</div></div>
    <div class="stat-mini-item"><div class="stat-mini-num" id="hmMastered">0</div><div class="stat-mini-lbl">已掌握</div></div>
    <div class="stat-mini-item"><div class="stat-mini-num" id="hmAcc">-</div><div class="stat-mini-lbl">正确率</div></div>
  </div>

  <div class="card section" style="padding-bottom:14px;">
    <div class="cal-header">
      <span class="cal-month" id="ciMonthLbl"></span>
      <button class="btn btn-sm btn-outline" id="ciBtn" onclick="doCheckin()" style="margin:0;">签到</button>
    </div>
    <div class="cal-grid" id="ciWeekHead"></div>
    <div class="cal-grid" id="ciGrid" style="margin-top:2px;"></div>
  </div>

  <div class="section">
    <div class="fold" id="foldAI">
      <button class="fold-trigger" onclick="toggleFold('foldAI')">AI 学情分析 <span class="plan-badge" id="planBadge" style="display:none;">计划生效中</span></button>
      <div class="fold-body">
        <div class="row-btns" style="margin-bottom:8px;">
          <input type="text" id="aiKey" placeholder="DeepSeek API Key" autocomplete="off" style="margin:0;">
          <input type="text" id="aiEndpoint" placeholder="API 地址" autocomplete="off" style="margin:0;max-width:140px;">
          <input type="text" id="aiModel" placeholder="模型名" autocomplete="off" style="margin:0;max-width:100px;">
        </div>
        <div style="font-size:10px;color:var(--muted);margin-bottom:8px;">默认 DeepSeek V3 · 也支持 OpenAI 兼容接口</div>
        <div class="row-btns" style="margin-bottom:8px;">
          <button class="btn btn-sm btn-pri" onclick="runAIAnalysis()" style="flex:1;">分析</button>
          <button class="btn btn-sm btn-ghost" onclick="saveAIConfig()" style="flex:1;">保存配置</button>
          <button class="btn btn-sm btn-outline" onclick="applyLatestPlan()" style="flex:1;">应用计划</button>
        </div>
        <div id="aiResult" class="ai-result"></div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="fold" id="foldSet">
      <button class="fold-trigger" onclick="toggleFold('foldSet')">设置</button>
      <div class="fold-body">
        <label class="label">考研日期</label>
        <input type="text" id="examDate" placeholder="如 2027-12-20" onchange="saveSettings()">
        <label class="label">偏好学习时段</label>
        <select id="prefTime" onchange="saveSettings()">
          <option value="any">不限</option><option value="morning">上午</option><option value="afternoon">下午</option><option value="evening">晚上</option>
        </select>
        <label class="label">墨墨 API Token</label>
        <div class="row-btns">
          <input type="text" id="apiTokenInput" placeholder="粘贴墨墨 Token" autocomplete="off" style="margin:0;">
          <button class="btn btn-sm btn-outline" onclick="saveToken()" style="flex:0 0 auto;margin:0;">保存</button>
        </div>
        <div style="font-size:10px;color:var(--muted);margin-bottom:12px;">用于查询例句、同步错词到墨墨云词本</div>
        <div class="row-btns" style="margin-bottom:12px;">
          <button class="btn btn-sm btn-outline" onclick="fetchMaimemoBooks()" style="flex:1;">从墨墨导入词库</button>
          <button class="btn btn-sm btn-ghost" onclick="syncWrongsToMaimemo()" style="flex:1;">推送错题到墨墨</button>
        </div>
        <div id="mmBookList" style="display:none;margin-bottom:12px;"></div>
        <label class="label">主题</label>
        <div class="row" id="themeRow" style="gap:8px;"></div>
        <div style="margin-top:12px;">
          <label class="label">数据管理</label>
          <div class="row-btns">
            <button class="btn btn-sm btn-outline" onclick="exportData()" style="flex:1;">导出</button>
            <button class="btn btn-sm btn-ghost" onclick="document.getElementById('importFile').click()" style="flex:1;">导入</button>
          </div>
          <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(this)">
          <button class="btn btn-sm btn-ghost" onclick="clearAll()" style="margin-top:8px;color:var(--danger);">清空数据</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ========== 学习页 ========== -->
<div class="page" id="p-session">
  <div class="flow-steps" id="flowSteps">
    <div class="flow-step on" id="fs-config"><div class="flow-dot"></div><span>配置</span></div>
    <div class="flow-step" id="fs-match"><div class="flow-dot"></div><span>热身</span></div>
    <div class="flow-step" id="fs-study"><div class="flow-dot"></div><span>背词</span></div>
    <div class="flow-step" id="fs-review"><div class="flow-dot"></div><span>复习</span></div>
  </div>

  <!-- 配置 -->
  <div id="panConfig">
    <div class="section">
      <label class="label">词库来源</label>
      <select id="studySource">
        <option value="mixed">全部混合</option>
        <option value="builtin">仅内置词库</option>
        <option value="imported">仅导入词库</option>
      </select>
    </div>
    <div class="section">
      <label class="label">学习数量 <span id="aiPlanHint" style="font-size:10px;color:var(--sub);"></span></label>
      <input type="number" id="customSize" value="20" min="5" max="200">
    </div>

<script>
// ============================================
// 🔑 密钥硬编码（直接修改下方引号内的值）
//    改完保存，本地 server 打开即可生效，无需反复填
// ============================================
const HARDCODED_KEYS = {
  deepseek:  'sk-3e8f8fdaf46d4ffc97daefa165cb47e2',  // DeepSeek API Key
  maimemo:   '5a82369773f4b96682aba0f19b524b3b310b30d7f5157cff751753abc9179ae1',  // 墨墨背单词 Token
};
// ============================================

// ============================================
// 数据层
// ============================================
const K = { bi:'bi',imp:'imp',prof:'v2_prof',wrongs:'v2_wrongs',cis:'cis',lhist:'lhist',recent:'recent',
  sch:'v2_sch',acct:'acct',accHist:'accHist',aiCfg:'aiCfg',aiPlan:'aiPlan',aiLog:'aiLog',set:'v2_set' };

let builtIn = JSON.parse(localStorage.getItem(K.bi) || '[]');
let imported = JSON.parse(localStorage.getItem(K.imp) || '[]');
let prof = JSON.parse(localStorage.getItem(K.prof) || '{}');
let wrongs = JSON.parse(localStorage.getItem(K.wrongs) || '[]');
let checkins = JSON.parse(localStorage.getItem(K.cis) || '[]');
let learnHist = JSON.parse(localStorage.getItem(K.lhist) || '{}');
let recentEns = JSON.parse(localStorage.getItem(K.recent) || '[]');
let reviewSchedule = JSON.parse(localStorage.getItem(K.sch) || '{}');
let accTrack = JSON.parse(localStorage.getItem(K.acct) || '{}');
let accHist = JSON.parse(localStorage.getItem(K.accHist) || '{}');
let aiConfig = JSON.parse(localStorage.getItem(K.aiCfg) || JSON.stringify({endpoint:'https://api.deepseek.com/v1',key:HARDCODED_KEYS.deepseek,model:'deepseek-chat'}));
let aiPlan = JSON.parse(localStorage.getItem(K.aiPlan) || 'null');
let aiLog = JSON.parse(localStorage.getItem(K.aiLog) || '[]');
let settings = JSON.parse(localStorage.getItem(K.set) || '{"examDate":"","prefTime":"any"}');

function saveAll() {
  Object.entries(K).forEach(([k, v]) => {
    const data = { bi:builtIn, imp:imported, v2_prof:prof, v2_wrongs:wrongs, cis:checkins, lhist:learnHist,
      recent:recentEns, v2_sch:reviewSchedule, acct:accTrack, accHist, aiCfg:aiConfig, aiPlan, aiLog, v2_set:settings }[k];
    if (data !== undefined) localStorage.setItem(v, JSON.stringify(data));
  });
}
function isFileProtocol() { return location.protocol === 'file:'; }
function todayStr() { return new Date().toLocaleDateString('zh-CN'); }
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1800);
}

// ============================================
// 工具
// ============================================
function parseWordLine(line) {
  line = line.trim(); if (!line) return null;
  for (const sep of ['|','：',':']) { const i = line.indexOf(sep); if (i>0) return {en:line.slice(0,i).trim(), ch:line.slice(i+1).trim()}; }
  const si = line.search(/\s/); if (si>0) return {en:line.slice(0,si).trim(), ch:line.slice(si+1).trim()};
  return null;
}
function shuffle(a) { const r=[...a]; for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function matchInput(input, ch) {
  const parts = ch.split(/[；;，,、]/); const u = input.trim(); if(!u) return false;
  return parts.some(p => { const pp=p.trim(); return pp===u || u.includes(pp) || pp.includes(u); });
}
function getProf(en) {
  return prof[en] || { lv:0, correct:0, wrong:0, totalTime:0, times:[], history:[], tag:'' };
}

// ============================================
// 导航
// ============================================
const NAV_MAP = {'p-home':'nav-home','p-session':'nav-session','p-match':'nav-match','p-review':'nav-review','p-lib':'nav-lib'};
function goTab(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.nav-btn').forEach(t => t.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  const nb = document.getElementById(NAV_MAP[id]); if(nb) nb.classList.add('on');
  window.scrollTo(0,0);
  if(id==='p-home'){ refreshHome(); renderCalendar(); }
  if(id==='p-review') renderTodayReview();
  if(id==='p-lib'){ refreshLib(); renderLevelTable(); renderWeekChart(); }
}
function toggleFold(id) { document.getElementById(id).classList.toggle('open'); }

// ============================================
// 主题
// ============================================
const THEMES = [{n:'竹绿',c:'#4a8c6f'},{n:'湖蓝',c:'#4a7d8c'},{n:'桃粉',c:'#c47d8a'},{n:'薰衣',c:'#7b6ab8'},{n:'暖橙',c:'#c08a4e'},{n:'墨灰',c:'#5a6b6b'}];
function applyTheme(name, color) {
  document.documentElement.style.setProperty('--pri', color);
  document.documentElement.style.setProperty('--pri-light', color+'18');
  localStorage.setItem('themeColor', color); localStorage.setItem('themeName', name);
  renderThemeDots();
}
function renderThemeDots() {
  const row = document.getElementById('themeRow'); if(!row) return;
  const saved = localStorage.getItem('themeName')||'竹绿';
  row.innerHTML = THEMES.map(t=>`<div class="tdot" style="width:28px;height:28px;border-radius:50%;background:${t.c};cursor:pointer;border:3px solid ${t.n===saved?'var(--text)':'transparent'};" onclick="applyTheme('${t.n}','${t.c}')"></div>`).join('');
}
function loadTheme() {
  const c = localStorage.getItem('themeColor')||'#4a8c6f', n = localStorage.getItem('themeName')||'竹绿';
  applyTheme(n, c);
}

// ============================================
// TTS
// ============================================
function speakWord(){ const w=document.getElementById('qWord').textContent.trim(); if(w) speak(w); }
function speakReviewWord(){ const w=document.getElementById('rWord').textContent.trim(); if(w) speak(w); }
function speak(word) {
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word); u.lang='en-US'; u.rate=0.85;
  window.speechSynthesis.speak(u);
}

// ============================================
// 签到 & 日历
// ============================================
function doCheckin() {
  const t = todayStr();
  if(checkins.includes(t)){ toast('今日已打卡'); return; }
  checkins.push(t); saveAll(); renderCalendar(); refreshHome();
}
function renderCalendar() {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  const days = new Date(y,m+1,0).getDate(), fd = new Date(y,m,1).getDay();
  document.getElementById('ciMonthLbl').textContent = `${y}年${m+1}月`;
  const btn = document.getElementById('ciBtn');
  if(checkins.includes(todayStr())){ btn.textContent='已打卡'; btn.style.color='var(--sub)'; }
  else { btn.textContent='签到'; btn.style.color='var(--pri)'; }
  document.getElementById('ciWeekHead').innerHTML = ['日','一','二','三','四','五','六'].map(d=>`<div class="cal-day-lbl">${d}</div>`).join('');
  let h='';
  for(let i=0;i<fd;i++) h+='<div class="cal-cell"></div>';
  for(let d=1;d<=days;d++){
    const ds = new Date(y,m,d).toLocaleDateString('zh-CN');
    h+=`<div class="cal-cell${checkins.includes(ds)?' hit':''}${d===now.getDate()?' today':''}">${d}</div>`;
  }
  document.getElementById('ciGrid').innerHTML = h;
}

// ============================================
// 首页
// ============================================
function refreshHome() {
  const s = (id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=v; };
  const t = todayStr();
  s('heroToday', learnHist[t]||0);
  let streak=0; const d=new Date();
  while(checkins.includes(d.toLocaleDateString('zh-CN'))){ streak++; d.setDate(d.getDate()-1); }
  s('heroStreak', streak);
  s('hmTotal', builtIn.length+imported.length);
  s('hmWrong', wrongs.length);
  s('hmMastered', Object.values(prof).filter(v=>v.lv>=4).length);
  const a = accHist[t]; s('hmAcc', a!==undefined ? a+'%' : '-');
  if (aiPlan) { document.getElementById('planBadge').style.display = 'inline-flex'; }
}

// ============================================
// 词库页
// ============================================
function refreshLib() {
  const s=(id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=v; };
  s('libBi', builtIn.length); s('libImp', imported.length);
  s('libWrong', wrongs.length); s('libMastered', Object.values(prof).filter(v=>v.lv>=4).length);
}
function renderWeekChart() {
  const chart = document.getElementById('weekChart'), labels = document.getElementById('weekLabels');
  if(!chart) return;
  let max=1;
  const data = []; const lbls = [];
  for(let i=6;i>=0;i--) {
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=d.toLocaleDateString('zh-CN');
    const v=learnHist[ds]||0; data.push(v); max=Math.max(max,v,1);
    lbls.push(['日','一','二','三','四','五','六'][d.getDay()]);
  }
  chart.innerHTML = data.map(v=>`<div class="mini-bar${v>0?' fill':''}" style="height:${Math.max(2,Math.round(v/max*48))}px;"></div>`).join('');
  labels.innerHTML = lbls.map(l=>`<span>${l}</span>`).join('');
}

// ============================================
// 内置词库 & 导入
// ============================================
const BUILTIN = `abandon|放弃；抛弃\nability|能力；才能\nabroad|在国外\nabsence|缺席；缺乏\nabsolute|绝对的\nabsorb|吸收\nabstract|抽象的；摘要\nabundant|丰富的\nabuse|滥用；虐待\nacademy|学院；学会\naccelerate|加速\naccess|进入；通道\naccommodate|容纳\naccompany|陪伴\naccomplish|完成\naccount|账户；解释\naccumulate|积累\naccurate|精确的\naccuse|指责\nachieve|实现\nacknowledge|承认\nacquire|获得\nadapt|适应\nadequate|足够的\nadjust|调整\nadministration|管理\nadmire|钦佩\nadmit|承认\nadopt|采用\nadvance|前进`.trim();

function loadBuiltIn() {
  let n=0;
  BUILTIN.split('\n').forEach(line => {
    const w=parseWordLine(line); if(!w) return;
    if(!builtIn.find(x=>x.en===w.en)){ builtIn.push(w); n++; }
  });
  saveAll(); refreshHome(); refreshLib(); renderLevelTable(); renderWeekChart();
  toast(`已激活 ${n} 个内置词汇`);
}
function addWordsToImported(words) {
  let n=0;
  words.forEach(w=>{ if(!imported.find(x=>x.en===w.en)){ imported.push(w); n++; } });
  saveAll(); return n;
}
function handleImport() {
  const file=document.getElementById('wordFile')?.files[0]; if(!file){ return; }
  const reader=new FileReader();
  reader.onload=function(e){
    const words=e.target.result.split('\n').map(parseWordLine).filter(Boolean);
    const n=addWordsToImported(words);
    toast(`导入 ${n} 个新词`);
    document.getElementById('wordFile').value='';
    refreshHome(); refreshLib(); renderLevelTable(); renderWeekChart();
  };
  reader.onerror=function(){ toast('文件读取失败'); };
  reader.readAsText(file);
}
function handlePasteImport() {
  const raw=document.getElementById('pasteInput').value;
  const words=raw.split('\n').map(parseWordLine).filter(Boolean);
  const n=addWordsToImported(words);
  document.getElementById('pasteMsg').textContent=`导入 ${n} 个新词`;
  document.getElementById('pasteInput').value='';
  refreshHome(); refreshLib(); renderLevelTable(); renderWeekChart();
}
function clearImported() {
  if(!confirm('确定清空所有导入词汇？')) return;
  imported=[]; saveAll(); refreshHome(); refreshLib(); renderLevelTable(); renderWeekChart();
  toast('已清空导入词库');
}

// ============================================
// JSON 导出/导入
// ============================================
function exportData() {
  const data={builtIn,imported,prof,wrongs,checkins,learnHist,recentEns,reviewSchedule,accTrack,accHist,aiPlan,aiLog,settings,exportedAt:new Date().toISOString()};

function collectFullData() {
  const all=[...builtIn,...imported], today=todayStr();
  const profDist={0:0,1:0,2:0,3:0,4:0}; all.forEach(w=>{ profDist[getProf(w.en).lv]++; });
  const labels=['未学','初学','熟悉','熟练','已掌握'];

  const dailyLearn={}, dailyAcc={}, dailySpeed={};
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i); const ds=d.toLocaleDateString('zh-CN');
    dailyLearn[ds]=learnHist[ds]||0;
    dailyAcc[ds]=accHist[ds]!==undefined?accHist[ds]+'%':'-';
    const tr=accTrack[ds]; dailySpeed[ds]=tr&&tr.count?Math.round(tr.totalTime/tr.count/1000)+'s':'-';
  }

  let streak=0; const sd=new Date();
  while(checkins.includes(sd.toLocaleDateString('zh-CN'))){ streak++; sd.setDate(sd.getDate()-1); }

  const lowWords=all.filter(w=>getProf(w.en).lv<=1).slice(0,20).map(w=>{
    const p=getProf(w.en); return {en:w.en,ch:w.ch,lv:labels[p.lv],avgTime:p.times.length?Math.round(p.times.reduce((a,b)=>a+b,0)/p.times.length/1000)+'s':'无',tag:p.tag};
  });

  const wrongSample=wrongs.slice(0,10).map(w=>({en:w.en,ch:w.ch}));

  const mastered=all.filter(w=>getProf(w.en).lv>=4).map(w=>w.en);
  const todayReviews=reviewSchedule[today]||[];

  // 时段分析
  const timeSlots={morning:[],afternoon:[],evening:[]};
  Object.entries(accTrack).forEach(([ds,tr])=>{
    if(!tr.slots) return;
    Object.entries(tr.slots).forEach(([slot,data])=>{
      if(timeSlots[slot]) timeSlots[slot].push({date:ds,acc:data.correct/Math.max(1,data.count)*100,speed:data.count?Math.round(data.totalTime/data.count/1000):0});
    });
  });

  // 上次计划执行情况
  let planFeedback='无历史计划';
  if(aiPlan&&aiPlan.appliedAt){
    const pa=aiPlan;
    const daysSince=Math.round((new Date()-new Date(pa.appliedAt))/(86400000));
    const recentAvg=Object.values(dailyLearn).reduce((a,b)=>a+b,0)/7;
    planFeedback=`上次计划(${daysSince}天前)：建议每日${pa.dailyNewWords}词，实际平均${Math.round(recentAvg)}词/天。建议间隔${JSON.stringify(pa.reviewIntervals)}。`;
  }

  // 遗忘曲线数据
  const retentionData=[];
  const now=Date.now();
  Object.entries(prof).forEach(([en,p])=>{
    if(p.history&&p.history.length>1){
      const firstLearned=new Date(p.history[0].date).getTime();
      const lastCorrect=[...p.history].reverse().find(h=>h.correct);
      if(lastCorrect){
        const daysSinceLast=Math.round((now-new Date(lastCorrect.date).getTime())/(86400000));
        if(daysSinceLast>0&&daysSinceLast<60) retentionData.push({en,daysSinceLast,lv:p.lv});
      }
    }
  });

  return {totalWords:all.length,builtInCount:builtIn.length,importedCount:imported.length,
    wrongCount:wrongs.length,masteredCount:mastered.length,profDist,labels,streak,totalCheckinDays:checkins.length,
    dailyLearn,dailyAcc,dailySpeed,lowWords,wrongSample,mastered,masteredSample:mastered.slice(0,5),
    todayReviewCount:todayReviews.length,todayLearned:learnHist[today]||0,todayAccuracy:accHist[today]!==undefined?accHist[today]+'%':'-',
    allWords:all.map(w=>({en:w.en,ch:w.ch,lv:labels[getProf(w.en).lv]})),
    timeSlots,planFeedback,retentionData,examDate:settings.examDate
  };
}

今日：学${data.todayLearned}词，正确率${data.todayAccuracy}，待复习${data.todayReviewCount}词
考试日期：${data.examDate||'未设置'}

近7天学习量：${JSON.stringify(data.dailyLearn)}
近7天正确率：${JSON.stringify(data.dailyAcc)}

function getWordPool(source) {
  let pool=[]; let prio=[];
  if(source==='builtin') pool=[...builtIn]; else if(source==='imported') pool=[...imported]; else pool=[...builtIn,...imported];
  // 薄弱词优先
  if(aiPlan&&aiPlan.weakPriority){
    const weak=pool.filter(w=>getProf(w.en).lv<=1); const rest=pool.filter(w=>getProf(w.en).lv>1);
    pool=[...shuffle(weak),...shuffle(rest)];
  }
  return pool;
}

let matchSt={};
function initMatch(pf,words){
  const pairs=words.slice(0,8);
  const cells=[];
  pairs.forEach((w,i)=>{ cells.push({id:i,type:'en',text:w.en,pairId:i}); cells.push({id:i,type:'ch',text:w.ch,pairId:i}); });
  matchSt[pf]={pairs,cells:shuffle(cells),sel:null,score:matchSt[pf]?.score||0,matched:new Set()};
  renderM(pf); updateM(pf);
}
function renderM(pf){
  const ms=matchSt[pf]; if(!ms) return;
  const grid=document.getElementById(pf==='s'?'sGrid':'mGrid');
  grid.innerHTML=ms.cells.map((c,i)=>{
    if(ms.matched.has(c.pairId)) return '<div class="mc ok"></div>';
    return `<div class="mc${ms.sel===i?' sel':''}" data-idx="${i}" data-pid="${c.pairId}" data-type="${c.type}" onclick="tapM('${pf}',${i})"><span>${c.text}</span></div>`;
  }).join('');
}
function updateM(pf){
  const ms=matchSt[pf]; if(!ms) return;
  const scoreEl=document.getElementById(pf==='s'?'sScore':'mScore');
  const pairsEl=document.getElementById(pf==='s'?'sPairs':'mPairs');
  if(scoreEl) scoreEl.textContent=ms.score;
  if(pairsEl) pairsEl.textContent=`${ms.matched.size}/${ms.pairs.length}`;
}
function tapM(pf,idx){
  const ms=matchSt[pf]; if(!ms||ms.matched.has(ms.cells[idx].pairId)) return;
  if(ms.sel===null){ ms.sel=idx; renderM(pf); return; }
  if(ms.sel===idx){ ms.sel=null; renderM(pf); return; }
  const a=ms.cells[ms.sel],b=ms.cells[idx];
  if(a.pairId===b.pairId&&a.type!==b.type){
    ms.matched.add(a.pairId); ms.score+=10; ms.sel=null; renderM(pf); updateM(pf);
    if(ms.matched.size===ms.pairs.length){
      setTimeout(()=>{
        if(pf==='s'){ if(confirm('全部配对！开始背词？')) goToStudy(); else renderSMatch(); }
        else{ toast('全部配对！得分'+ms.score); refreshMatch(); }
      },400);
    }
  } else { const prev=ms.sel; ms.sel=null; renderM(pf); const grid=document.getElementById(pf==='s'?'sGrid':'mGrid');
    const cells=grid.querySelectorAll('.mc'); [cells[prev],cells[idx]].forEach(c=>c.classList.add('err'));
    setTimeout(()=>renderM(pf),350); }
}

  accTrack[ds].count+=t; accTrack[ds].correct+=c; accTrack[ds].totalTime+=sessTotalTime;
  if(!accTrack[ds].slots[sessTimeSlot]) accTrack[ds].slots[sessTimeSlot]={count:0,correct:0,totalTime:0};
  accTrack[ds].slots[sessTimeSlot].count+=t; accTrack[ds].slots[sessTimeSlot].correct+=c; accTrack[ds].slots[sessTimeSlot].totalTime+=sessTotalTime;
  accHist[ds]=Math.round(accTrack[ds].correct/Math.max(1,accTrack[ds].count)*100);

  sessWords.forEach(w=>{

  });
  // 艾宾浩斯调度

  });

function checkAnswer() {
  const input=document.getElementById('uInput').value; if(!input.trim()) return;
  const rt=Date.now()-qStartTime; sessTotalTime+=rt;
  const w=sessWords[sessIdx];
  document.getElementById('qHint').textContent=w.ch;
  const isCorrect=matchInput(input,w.ch);
  const p=getProf(w.en);
  p.history=p.history||[]; p.history.push({date:todayStr(),time:rt,correct:isCorrect});
  p.times=p.times||[]; p.times.push(rt);
  p.totalTime=(p.totalTime||0)+rt;

  if(isCorrect){
    sessCorrect++;
    p.correct=(p.correct||0)+1;
    p.lv=Math.min(4,(p.lv||0)+1);
    const avgT=p.times.reduce((a,b)=>a+b,0)/p.times.length;
    // 假掌握：答对但耗时超过平均的1.5倍
    const slowFlag=avgT>3000&&rt>avgT*1.5?' ⚠假掌握':'';
    document.getElementById('qFb').innerHTML=`✓ 正确 · ${Math.round(rt/1000)}s${slowFlag}`;
    document.getElementById('qFb').className='study-fb fb-ok';
  } else {
    p.wrong=(p.wrong||0)+1; p.lv=Math.max(0,(p.lv||0)-1);
    sessWrongs.push(w);
    if(!wrongs.find(x=>x.en===w.en)) wrongs.push(w);
    document.getElementById('qFb').innerHTML=`✗ 错误 · ${Math.round(rt/1000)}s`;
    document.getElementById('qFb').className='study-fb fb-err';
  }
  prof[w.en]=p; saveAll();

  setTimeout(()=>{ sessIdx++; renderStudyCard(); }, 700);
}

  if(revIdx>=revWords.length){ showAllDone(); return; }
  const w=revWords[revIdx];
  document.getElementById('rWord').textContent=w.en;
  document.getElementById('rFb').innerHTML=''; document.getElementById('rFb').className='study-fb';
  document.getElementById('ruInput').value='';
  document.getElementById('reviewInfo').textContent=`${revIdx+1}/${revWords.length}`;
  document.getElementById('reviewProg').style.width=(revIdx/revWords.length*100)+'%';
  const p=getProf(w.en);
  document.getElementById('rDots').innerHTML=`<span class="tag tag-l${p.lv}">${['未学','初学','熟悉','熟练','已掌握'][p.lv]}</span>`;
  document.getElementById('ruInput').focus();
}
function checkReview() {
  const input=document.getElementById('ruInput').value; if(!input.trim()) return;
  const w=revWords[revIdx];
  if(matchInput(input,w.ch)){
    revCorrect++; const p=getProf(w.en); p.lv=Math.min(4,p.lv+2); prof[w.en]=p;
    wrongs=wrongs.filter(x=>x.en!==w.en);
    document.getElementById('rFb').innerHTML='✓ 正确 · 已移出错题本';
    document.getElementById('rFb').className='study-fb fb-ok';
  } else {
    document.getElementById('rFb').innerHTML='✗ 仍错误<br><small>'+w.ch+'</small>';
    document.getElementById('rFb').className='study-fb fb-err';
  }
  saveAll();
  setTimeout(()=>{ revIdx++; renderReviewCard(); }, 800);
}
function skipReview() {
  const w=revWords[revIdx];
  document.getElementById('rFb').innerHTML='答案：'+w.ch;
  document.getElementById('rFb').className='study-fb fb-err';
  setTimeout(()=>{ revIdx++; renderReviewCard(); }, 800);
}
function showAllDone() {
  panShow('panDone'); setFlowStep('review');
  const total=sessWords.length+revWords.length; const correct=sessCorrect+revCorrect;
  document.getElementById('allDoneMsg').innerHTML=`答对 ${correct}/${total}（${total>0?Math.round(correct/total*100):0}%）<br>错题本剩余 ${wrongs.length} 词`;
  saveAll(); refreshHome();
}
function endSession() {
  sessPhase='config'; setFlowStep('config'); panShow('panConfig');
  ['config','match','study','review'].forEach(s=>{ const el=document.getElementById('fs-'+s); if(el) el.classList.remove('done'); });
  document.getElementById('fs-config').classList.add('on');
  refreshHome();
}

// ============================================
// 独立消除赛
// ============================================
function getMatchPool(src) {
  if(src==='recent'){ const all=[...builtIn,...imported]; return recentEns.map(en=>all.find(w=>w.en===en)).filter(Boolean); }
  return getWordPool(src);
}
function startMatch() {
  const src=document.getElementById('matchSource').value;
  const pool=getMatchPool(src); if(pool.length<4){ toast('词库不足'); return; }
  document.getElementById('mCfgCard').style.display='none';
  document.getElementById('mGameCard').style.display='block';
  const labels={recent:'最近学习',builtin:'内置词库',imported:'导入词库',mixed:'全部混合'};
  document.getElementById('mModeLbl').textContent=labels[src];
  matchSt['m']=null; initMatch('m',shuffle(pool).slice(0,8));
}
function refreshMatch() {
  const src=document.getElementById('matchSource').value;
  matchSt['m']=null; initMatch('m',shuffle(getMatchPool(src)).slice(0,8));
}
function backMatchCfg() {
  document.getElementById('mGameCard').style.display='none';
  document.getElementById('mCfgCard').style.display='block';
}

// ============================================
// 艾宾浩斯复习页
// ============================================
function renderTodayReview() {
  const today=todayStr();
  const words=reviewSchedule[today]||[];
  document.getElementById('todayReviewCount').textContent=`${words.length} 词`;

  // 遗忘预警
  const now=Date.now();
  const atRisk=[];
  Object.entries(prof).forEach(([en,p])=>{
    if(p.lv>=2&&p.history&&p.history.length){
      const last=p.history.filter(h=>h.correct).pop();
      if(last){
        const daysSince=Math.round((now-new Date(last.date).getTime())/(86400000));
        const maxInterval=aiPlan?.reviewIntervals?Math.max(...aiPlan.reviewIntervals):30;
        if(daysSince>maxInterval) atRisk.push({en,daysSince,ch:(builtIn.find(w=>w.en===en)||imported.find(w=>w.en===en)||{ch:'?'}).ch});
      }
    }
  });
  const warnEl=document.getElementById('forgetWarn');
  if(atRisk.length>0){
    warnEl.style.display='block';
    warnEl.innerHTML=`⚠ 遗忘预警：${atRisk.length} 个词超过复习周期，可能即将遗忘 — ${atRisk.slice(0,5).map(r=>r.en+'('+r.daysSince+'天)').join('、')}`;
  } else { warnEl.style.display='none'; }

  const list=document.getElementById('todayReviewList');
  if(words.length===0){
    list.innerHTML='<div style="text-align:center;color:var(--sub);padding:24px 0;">今天暂无复习任务</div>';
    return;
  }
  list.innerHTML=words.map(w=>{
    const p=getProf(w.en);
    return `<div class="word-row"><div><div class="word-en">${w.en}</div><div class="word-meta"><span class="tag tag-l${p.lv}">${['未学','初学','熟悉','熟练','已掌握'][p.lv]}</span></div></div><div class="word-ch">${w.ch}</div></div>`;
  }).join('');
}
function startTodayReview() {
  const today=todayStr(); const words=reviewSchedule[today]||[];
  if(words.length===0){ toast('今天暂无复习任务'); return; }
  revWords=shuffle(words); revIdx=0; revCorrect=0;
  sessPhase='review'; setFlowStep('review');
  goTab('p-session');
  panShow('panReview');
  document.getElementById('reviewInfo').textContent='艾宾浩斯复习';
  renderReviewCard();
}

// ============================================
// 墨墨同步
// ============================================
async function syncWrongsToMaimemo() {
  const t=localStorage.getItem('apiToken')||'';
  if(!t){ toast('请先在设置中配置Token'); return; }
  if(isFileProtocol()){ toast('⚠ file:// 协议禁止 API 请求，请通过 http://localhost 打开'); return; }
  if(wrongs.length===0){ toast('错题本为空'); return; }
  try{
    const body=JSON.stringify({words:wrongs.map(w=>w.en)});
    const res=await fetch('https://open.maimemo.com/open/api/v1/study/add_words',{method:'POST',headers:{'Authorization':`Bearer ${t}`,'Content-Type':'application/json'},body});
    if(!res.ok) throw new Error('同步失败');
    toast(`已同步 ${wrongs.length} 个错词`);
  } catch(e){ toast('同步失败: '+e.message); }
}

async function fetchMaimemoBooks() {
  const t=localStorage.getItem('apiToken')||'';
  if(!t){ toast('请先填写墨墨 Token'); return; }
  if(isFileProtocol()){ toast('⚠ file:// 协议禁止 API 请求，请通过 http://localhost 打开'); return; }
  const el=document.getElementById('mmBookList');
  el.style.display='block';
  el.innerHTML='<div style="font-size:12px;color:var(--sub);padding:8px 0;">加载词本列表...</div>';
  try{
    const res=await fetch('https://open.maimemo.com/open/api/v1/notepads?limit=20',{headers:{'Authorization':`Bearer ${t}`}});
    if(!res.ok) throw new Error('Token 无效');
    const json=await res.json();
    if(!json.success) throw new Error(json.errors?.[0]?.msg||'请求失败');
    const books=json.data.notepads||[];
    if(!books.length){ el.innerHTML='<div style="font-size:12px;color:var(--sub);">未找到词本，请先在墨墨创建词本</div>'; return; }
    el.innerHTML=books.filter(b=>b.type!=='FAVORITE').map(b=>`<div class="row" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0ec;">
      <div><div style="font-size:13px;font-weight:500;">${b.title||'未命名'}</div><div style="font-size:10px;color:var(--sub);">${b.brief||''}</div></div>
      <button class="btn btn-sm btn-outline" onclick="importFromMaimemoBook('${b.id}','${(b.title||'未命名').replace(/'/g,"\\'")}')">导入</button>
    </div>`).join('');
  } catch(e){ el.innerHTML=`<div style="font-size:12px;color:var(--danger);">加载失败：${e.message}</div>`; }
}

async function importFromMaimemoBook(bookId, bookName) {
  const t=localStorage.getItem('apiToken')||'';
  const el=document.getElementById('mmBookList');
  el.innerHTML=`<div style="font-size:12px;color:var(--sub);padding:8px 0;">正在从「${bookName}」导入...</div>`;
  try{
    const res=await fetch(`https://open.maimemo.com/open/api/v1/notepads/${encodeURIComponent(bookId)}`,{headers:{'Authorization':`Bearer ${t}`}});
    if(!res.ok) throw new Error('请求失败');
    const json=await res.json();
    if(!json.success) throw new Error(json.errors?.[0]?.msg||'');
    const words=(json.data.notepad.list||[]).filter(e=>e.type==='WORD'&&e.word).map(e=>({en:e.word,ch:e.chinese||''}));
    if(words.length===0){ toast('该词本无可导入词汇'); el.style.display='none'; return; }
    let n=0;
    words.forEach(w=>{ if(!imported.find(x=>x.en===w.en)){ imported.push(w); n++; } });
    saveAll(); refreshHome(); refreshLib(); renderLevelTable();
    el.innerHTML=`<div style="font-size:12px;color:var(--pri);padding:8px 0;">从「${bookName}」导入 ${n} 个新词（共 ${words.length} 词）</div>`;
    toast(`导入 ${n} 个新词`);
  } catch(e){ el.innerHTML=`<div style="font-size:12px;color:var(--danger);">导入失败：${e.message}</div>`; }
}

async function showExample(word, cid) {
  const el=document.getElementById(cid); if(!el) return;
  const t=localStorage.getItem('apiToken')||'';
  if(!t){ el.innerHTML='<span style="color:var(--danger);">需配置Token</span>'; return; }
  el.innerHTML='查询中...';
  try{
    const res=await fetch(`https://open.maimemo.com/open/api/v1/vocabulary?spelling=${encodeURIComponent(word)}`,{headers:{'Authorization':`Bearer ${t}`}});
    const json=await res.json();
    if(json.success&&json.data&&json.data.voc){
      const v=json.data.voc;
      const def=v.definition||v.translation||'';
      el.innerHTML=`<small>释义：${def||'无'}</small>`;
    } else { el.innerHTML='<span style="color:var(--sub);">暂无例句</span>'; }
  } catch(e){ el.innerHTML=`<span style="color:var(--danger);">失败</span>`; }
}
function fetchExample(){ showExample(document.getElementById('qWord').textContent.trim(),'qFb'); }
function fetchReviewExample(){ showExample(document.getElementById('rWord').textContent.trim(),'rFb'); }

// ============================================
// 单词等级表
// ============================================
function renderLevelTable() {
  const all=[...builtIn,...imported];
  const search=(document.getElementById('levelSearch')?.value||'').trim().toLowerCase();
  const filtered=search?all.filter(w=>w.en.toLowerCase().includes(search)):all;
  const labels=['未学','初学','熟悉','熟练','已掌握'];
  const el=document.getElementById('levelTable'); if(!el) return;
  if(filtered.length===0){ el.innerHTML='<div style="text-align:center;color:var(--sub);padding:20px 0;">无匹配</div>'; return; }
  el.innerHTML=filtered.map(w=>{
    const p=getProf(w.en); const avgT=p.times&&p.times.length?Math.round(p.times.reduce((a,b)=>a+b,0)/p.times.length/1000)+'s':'-';
    return `<div class="word-row"><div><div class="word-en">${w.en} <span class="tag tag-l${p.lv}">${labels[p.lv]}</span>${p.tag?` <span class="tag tag-l1">${p.tag}</span>`:''}</div><div class="word-meta">均${avgT} · ${builtIn.find(x=>x.en===w.en)?'内置':'导入'}</div></div><div class="word-ch">${w.ch}</div></div>`;
  }).join('');
}

// ============================================
// 键盘快捷键
// ============================================
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'){ if(sessPhase==='study') checkAnswer(); else if(sessPhase==='review') checkReview(); }
  if(e.key==='Escape'){ if(sessPhase==='study') skipWord(); else if(sessPhase==='review') skipReview(); }
});

// ============================================
// 初始化
// ============================================
function init() {
  loadTheme(); renderThemeDots(); renderCalendar(); refreshHome();
  refreshLib(); renderLevelTable(); renderWeekChart(); renderTodayReview();
  setFlowStep('config'); loadAIConfig(); loadSettings();
  if(aiPlan&&aiPlan.appliedAt){
    document.getElementById('customSize').value=aiPlan.dailyNewWords||20;
    document.getElementById('aiPlanHint').textContent=`(AI建议：${aiPlan.dailyNewWords}词/天)`;
    document.getElementById('planBadge').style.display='inline-flex';
  }
}
init();
